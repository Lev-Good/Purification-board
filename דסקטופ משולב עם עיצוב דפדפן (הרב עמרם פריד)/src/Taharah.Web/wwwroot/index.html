<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>לוח טהרה — הגר״ע פריד שליט״א</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Taharah.Web.Shared/css/fonts.css" />
    <link rel="stylesheet" href="_content/Taharah.Web.Shared/css/taharah.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #faf9f6; font-family: 'Assistant', sans-serif;">
            <div style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(30, 58, 95, 0.15); border-top-color: #1e3a5f; animation: spin 0.9s linear infinite; margin-bottom: 20px;"></div>
            <div style="font-size: 19px; font-weight: 800; color: #1e3a5f; letter-spacing: -0.3px;">לוח טהרה</div>
            <div style="font-size: 13px; color: #64748b; margin-top: 4px;">טוען את המערכת המאובטחת...</div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>

    <div id="blazor-error-ui">
        אירעה שגיאה בלתי צפויה במערכת.
        <a href="." class="reload">רענן דף</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/Taharah.Web.Shared/js/taharah.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
