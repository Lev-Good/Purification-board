<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>לוח טהרה — הגר״ע פריד שליט״א</title>

                to { transform: rotate(360deg); }
